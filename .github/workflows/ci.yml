name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Types, lint, unit and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - run: pnpm check

      - name: Database advisors report nothing
        run: pnpm exec supabase db advisors --local --fail-on warn

      - name: Generated database types match the migrations
        run: pnpm db:types && git diff --exit-code src/lib/database.types.ts

  browser:
    name: End-to-end and visual tests
    # arm64, like the Apple Silicon Macs the screenshots are made on: the visual
    # tests compare pixels, and Chromium doesn't render identically on x64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - id: build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/e2e

      - name: Visual tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:visual
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/visual

      # For a failed screenshot the report shows expected, actual and the difference.
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
